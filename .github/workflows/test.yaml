name: Test

on:
  pull_request:

defaults:
  run:
    shell: bash -el {0}

jobs:
  unit:
    name: Unit Tests
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
        python: [3.11, 3.13]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: pytest-indigo-dev
          environment-file: environment.yaml
          python-version: ${{ matrix.python }}
          auto-activate: false
      
      - name: Test
        run: pytest
